general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
}

# Background: screenshot of your current desktop
background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 8

    noise = 0.02
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.1
    vibrancy_darkness = 0.1
}

# Big clock
label {
    monitor =

    text = cmd[update:1000] echo "$(date '+%I:%M')"

    color = rgba(ffffffff)

    font_size = 72
    font_family = CodeNewRoman Nerd Font Propo

    position = 0, 180
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 2
}

# Date underneath
label {
    monitor =

    text = cmd[update:1000] echo "$(date '+%A, %B %d')"

    color = rgba(ffffffcc)

    font_size = 18
    font_family = CodeNewRoman Nerd Font Propo

    position = 0, 115
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 2
}

# Password input — styled like your Waybar modules
input-field {
    monitor =

    size = 350, 55

    outline_thickness = 2

    outer_color = rgba(ffffff33)
    inner_color = rgba(00000099)
    font_color = rgba(ffffffff)

    check_color = rgba(ffffff88)
    fail_color = rgba(ff5555cc)

    fade_on_empty = false

    rounding = 10

    placeholder_text = <i>Password...</i>

    dots_size = 0.25
    dots_spacing = 0.2

    position = 0, -110
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgba(00000099)
}

