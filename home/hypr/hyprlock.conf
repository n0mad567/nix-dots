general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%I:%M %p')"
    color = rgba(ffffffff)
    font_size = 80
    font_family = Sans
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %B %d')"
    color = rgba(ccccccff)
    font_size = 20
    font_family = Sans
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2

    outer_color = rgba(ffffff88)
    inner_color = rgba(00000088)
    font_color = rgba(ffffffff)

    fade_on_empty = false
    placeholder_text = <i>Password...</i>

    position = 0, -100
    halign = center
    valign = center
}